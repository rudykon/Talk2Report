<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="400" viewBox="0 0 1300 400" role="img" aria-labelledby="title desc">
  <title id="title">Talk2Report</title>
  <desc id="desc">T2R monogram and Talk2Report wordmark with the tagline Conversations. Perfected.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42D8D1"/>
      <stop offset="0.42" stop-color="#11B4B8"/>
      <stop offset="1" stop-color="#007481"/>
    </linearGradient>
    <linearGradient id="tealDark" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#028A96"/>
      <stop offset="1" stop-color="#005967"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13BFC1"/>
      <stop offset="1" stop-color="#51DCD5"/>
    </linearGradient>
    <clipPath id="twoClip">
      <text x="102" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="302" font-weight="850">2</text>
    </clipPath>
    <style>
      :root { --ink: #12161D; --muted: #343B46; }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #F4F7FA; --muted: #D3DAE3; }
      }
      .ink { fill: var(--ink); }
      .muted { fill: var(--muted); }
      .type { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <g class="type" transform="translate(12 0)">
    <text class="ink" x="18" y="294" font-size="302" font-weight="850" letter-spacing="-20">T</text>
    <text class="ink" x="194" y="294" font-size="302" font-weight="850" letter-spacing="-18">R</text>
    <text x="102" y="294" font-size="302" font-weight="850" fill="url(#teal)">2</text>
    <g clip-path="url(#twoClip)">
      <path d="M91 150 C162 112 226 123 274 174 C224 155 183 171 142 208 Z" fill="url(#tealDark)" opacity="0.88"/>
      <path d="M112 267 H278 L305 306 H94 Z" fill="url(#tealLight)" opacity="0.95"/>
    </g>
  </g>

  <rect x="421" y="74" width="8" height="248" rx="4" fill="#FF6A2A"/>

  <text class="type" x="487" y="218" font-size="119" font-weight="730" letter-spacing="-5">
    <tspan class="ink">Talk</tspan><tspan fill="url(#teal)">2</tspan><tspan class="ink">Report</tspan>
  </text>

  <text class="type" x="494" y="294" font-size="28" font-weight="700" letter-spacing="9.5">
    <tspan class="muted">CONVERSATIONS.</tspan><tspan fill="#FF6A2A"> PERFECTED.</tspan>
  </text>
</svg>
