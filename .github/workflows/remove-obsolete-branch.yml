name: Remove obsolete branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-obsolete-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: attr-cm-cms-stage-a-qszc
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TARGET_BRANCH}"
            echo "Deleted branch: ${TARGET_BRANCH}"
          else
            echo "Branch already absent: ${TARGET_BRANCH}"
          fi
